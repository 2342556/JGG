# For a networked environment: PostgreSQL 17 + Redis for production-like runs. Not used by the offline dev build.
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: jgg_dev_only, POSTGRES_DB: jgg }
    ports: ["5432:5432"]
    volumes: ["./postgres/migrations:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
